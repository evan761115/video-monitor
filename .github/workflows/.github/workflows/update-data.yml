name: 更新影音監測資料

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r scraper/requirements.txt

      - name: 執行抓取腳本
        working-directory: scraper
        run: python fetch_media.py

      - name: 把 data.json 搬到網站根目錄
        run: cp scraper/data.json data.json

      - name: 提交更新
        run: |
          git config user.name "video-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "自動更新影音資料 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
